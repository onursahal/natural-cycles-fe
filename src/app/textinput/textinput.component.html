<div class="input-container">
  <span class="input-title">{{ title() }}</span>

  @if (type() === 'countdown') {
    <input
      type="text"
      class="rounded-input"
      (click)="onFocus()"
      [matDatepicker]="picker"
      (dateChange)="onChange($event)"
      [min]="minDate"
      [defaultValue]="formattedDate() || ''"
    />
  }
  @if (type() === 'title') {
    <input
      type="text"
      class="rounded-input"
      (input)="onChange($event)"
      [value]="value()"
    />
  }
  <mat-datepicker #picker></mat-datepicker>
</div>
